<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <style>html, body, #map { height: 100%; margin: 0; } .picking { cursor: crosshair; }</style>
</head>
<body>
    <div id="map" aria-label="Mapa para seleccionar el punto de salida"></div>
    <script>
        const container = document.getElementById('map');
        if (!window.L) {
            container.textContent = 'No se pudo cargar el mapa interactivo.';
        } else {
            const farm = __FARM_COORDINATES__;
            const map = L.map(container, { scrollWheelZoom: false }).setView(farm, 13);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
            }).addTo(map);
            L.circleMarker(farm, { radius: 8, color: '#145b37', fillOpacity: 1 }).addTo(map).bindTooltip('Finca');
            const layers = L.layerGroup().addTo(map);
            let picking = false;
            let lastOrigin = '';
            map.on('click', ({ latlng }) => {
                if (picking) parent.postMessage({ type: 'pickup-origin', point: [latlng.lat, latlng.wrap().lng] }, '*');
            });
            window.addEventListener('message', ({ source, data }) => {
                if (source !== parent || data?.type !== 'pickup-map') return;
                picking = data.picking;
                container.classList.toggle('picking', picking);
                layers.clearLayers();
                if (!data.origin) return;
                L.circleMarker(data.origin, { radius: 8, color: '#1262a8', fillOpacity: 1 }).addTo(layers).bindTooltip('Salida');
                if (data.path?.length) {
                    const line = L.polyline(data.path, { color: '#145b37', weight: 5 }).addTo(layers);
                    map.fitBounds(line.getBounds(), { padding: [20, 20], maxZoom: 15 });
                } else if (lastOrigin !== String(data.origin)) {
                    map.fitBounds([data.origin, farm], { padding: [20, 20], maxZoom: 15 });
                }
                lastOrigin = String(data.origin);
            });
        }
    </script>
</body>
</html>
